<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoE2 0.5 Gemling Quality with Weapons</title>
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #1e1e1e;
            --bg-hover: #252525;
            --accent: #c8a84b;
            --accent-dark: #8b6914;
            --accent-glow: rgba(200, 168, 75, 0.15);
            --text-primary: #e8e0d0;
            --text-secondary: #a09880;
            --text-muted: #605850;
            --border: #2a2a2a;
            --border-accent: #3a3020;
            --gemling: #4a9fd4;
            --gemling-bg: rgba(74, 159, 212, 0.1);
            --normal: #d4944a;
            --normal-bg: rgba(212, 148, 74, 0.1);
            --yes-color: #4dba6f;
            --no-color: #ba4d4d;
            --tag-bg: #252015;
            --tag-border: #3a3020;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background: linear-gradient(180deg, #0a0a0a 0%, #141410 100%);
            border-bottom: 2px solid var(--accent-dark);
            padding: 20px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .header-logo {
            font-size: 22px;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(200,168,75,0.4);
            white-space: nowrap;
        }

        .header-logo span {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
        }

        .search-bar {
            flex: 1;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-accent);
            border-radius: 6px;
            padding: 10px 16px 10px 42px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .search-bar input::placeholder {
            color: var(--text-muted);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 18px;
            pointer-events: none;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            padding: 2px 6px;
            border-radius: 4px;
            display: none;
            transition: color 0.2s;
        }

        .clear-btn:hover { color: var(--accent); }

        /* FILTERS */
        .filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .filter-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-btn {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 5px 12px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            border-color: var(--accent-dark);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent-dark);
            color: var(--accent);
        }

        .stats-bar {
            margin-left: auto;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .stats-bar strong {
            color: var(--accent);
        }

        /* SORT BUTTONS */
        .sort-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* MAIN */
        .main {
            padding: 20px 24px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* VIEW TOGGLE */
        .view-toggle {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            align-items: center;
        }

        .view-btn {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 6px 14px;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--accent-glow);
            border-color: var(--accent-dark);
            color: var(--accent);
        }

        /* GRID VIEW */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 12px;
        }

        /* TABLE VIEW */
        .skills-table-wrap {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .skills-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .skills-table th {
            background: #141410;
            color: var(--accent);
            padding: 10px 14px;
            text-align: left;
            border-bottom: 2px solid var(--accent-dark);
            white-space: nowrap;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        .skills-table th:hover { background: #1a1a14; }

        .skills-table th .sort-arrow {
            margin-left: 4px;
            opacity: 0.4;
            font-size: 10px;
        }

        .skills-table th.sorted .sort-arrow { opacity: 1; }

        .skills-table tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
        }

        .skills-table tr:hover { background: var(--bg-hover); }

        .skills-table td {
            padding: 9px 14px;
            vertical-align: middle;
        }

        .skills-table tr.hidden { display: none; }

        /* CARD */
        .skill-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px;
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }

        .skill-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-dark), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .skill-card:hover {
            border-color: var(--border-accent);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transform: translateY(-1px);
        }

        .skill-card:hover::before { opacity: 1; }

        .skill-card.no-gemling {
            opacity: 0.6;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .skill-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--accent);
            line-height: 1.3;
        }

        .gemling-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 3px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }

        .gemling-badge.yes {
            background: rgba(77, 186, 111, 0.15);
            color: var(--yes-color);
            border: 1px solid rgba(77, 186, 111, 0.3);
        }

        .gemling-badge.no {
            background: rgba(186, 77, 77, 0.1);
            color: var(--no-color);
            border: 1px solid rgba(186, 77, 77, 0.2);
        }

        .weapon-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .weapon-tag {
            font-size: 10px;
            padding: 2px 7px;
            background: var(--tag-bg);
            border: 1px solid var(--tag-border);
            border-radius: 3px;
            color: var(--text-muted);
        }

        .weapon-tag.any {
            color: var(--text-secondary);
            border-color: var(--border);
        }

        .quality-block {
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .quality-block.normal {
            background: var(--normal-bg);
            border: 1px solid rgba(212, 148, 74, 0.2);
        }

        .quality-block.gemling {
            background: var(--gemling-bg);
            border: 1px solid rgba(74, 159, 212, 0.2);
        }

        .quality-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .quality-label.normal { color: var(--normal); }
        .quality-label.gemling { color: var(--gemling); }

        .quality-stat {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
        }

        .quality-value {
            font-size: 13px;
            font-weight: 600;
        }

        .quality-value.normal { color: var(--normal); }
        .quality-value.gemling { color: var(--gemling); }

        .internal-id {
            font-size: 10px;
            color: var(--text-muted);
            font-family: monospace;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            word-break: break-all;
        }

        /* TABLE SPECIFIC */
        .td-name {
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
        }

        .td-weapon {
            font-size: 11px;
            color: var(--text-muted);
            max-width: 200px;
        }

        .td-stat {
            font-family: monospace;
            font-size: 11px;
            color: var(--text-secondary);
            max-width: 220px;
            word-break: break-all;
        }

        .td-value-normal {
            font-weight: 600;
            color: var(--normal);
            white-space: nowrap;
        }

        .td-value-gemling {
            font-weight: 600;
            color: var(--gemling);
            white-space: nowrap;
        }

        .td-badge { }

        /* NO RESULTS */
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            display: none;
        }

        .no-results-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-dark); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        /* HIGHLIGHT */
        .highlight {
            background: rgba(200, 168, 75, 0.25);
            color: var(--accent);
            border-radius: 2px;
            padding: 0 1px;
        }

        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: stretch; }
            .filters { gap: 8px; }
            .main { padding: 12px; }
            .skills-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-top">
        <div class="header-logo">
            PoE2 0.5 <span>Gemling Quality & Weapons</span>
        </div>
        <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Поиск по названию, стату, internal ID, оружию...">
            <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
        </div>
    </div>
    <div class="filters">
        <div class="filter-group">
            <span class="filter-label">Gemling:</span>
            <button class="filter-btn active" data-filter="all" onclick="setFilter('gemling', 'all', this)">Все</button>
            <button class="filter-btn" data-filter="yes" onclick="setFilter('gemling', 'yes', this)">✓ Есть</button>
            <button class="filter-btn" data-filter="no" onclick="setFilter('gemling', 'no', this)">✗ Нет</button>
        </div>
        <div class="filter-group">
            <span class="filter-label">Тип:</span>
            <button class="filter-btn active" data-filter="all" onclick="setFilter('support', 'all', this)">Все</button>
            <button class="filter-btn" data-filter="skill" onclick="setFilter('support', 'skill', this)">Скиллы</button>
            <button class="filter-btn" data-filter="support" onclick="setFilter('support', 'support', this)">Саппорты</button>
        </div>
        <div class="filter-group">
            <span class="filter-label">Оружие:</span>
            <select id="weaponFilter" onchange="applyFilters()" style="background:#111;border:1px solid var(--border);border-radius:4px;padding:5px 10px;color:var(--text-secondary);font-size:12px;outline:none;cursor:pointer;">
                <option value="all">Все</option>
                <option value="any">Any / no weapon req</option>
                <option value="Bows">Bows</option>
                <option value="Crossbows">Crossbows</option>
                <option value="Spears">Spears</option>
                <option value="Quarterstaves">Quarterstaves</option>
                <option value="Maces">Maces</option>
                <option value="Swords">Swords</option>
                <option value="Axes">Axes</option>
                <option value="Daggers">Daggers</option>
                <option value="Claws">Claws</option>
                <option value="Shields">Shields</option>
                <option value="Talismans">Talismans</option>
                <option value="Flails">Flails</option>
            </select>
        </div>
        <span class="stats-bar">Показано: <strong id="countShown">0</strong> / <strong id="countTotal">0</strong></span>
    </div>
</div>

<div class="main">
    <div class="view-toggle">
        <span style="font-size:12px;color:var(--text-muted);margin-right:4px;">Вид:</span>
        <button class="view-btn active" onclick="setView('grid', this)">⊞ Карточки</button>
        <button class="view-btn" onclick="setView('table', this)">☰ Таблица</button>
    </div>

    <div id="gridView">
        <div class="skills-grid" id="skillsGrid"></div>
    </div>

    <div id="tableView" style="display:none;">
        <div class="skills-table-wrap">
            <table class="skills-table" id="skillsTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)" data-col="0">Название <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(1)" data-col="1">Оружие <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(2)" data-col="2">Normal Stat <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(3)" data-col="3">Normal Value <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(4)" data-col="4">Gemling Stat <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(5)" data-col="5">Gemling Value <span class="sort-arrow">↕</span></th>
                        <th onclick="sortTable(6)" data-col="6">Gemling <span class="sort-arrow">↕</span></th>
                    </tr>
                </thead>
                <tbody id="skillsTableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="no-results" id="noResults">
        <div class="no-results-icon">🔮</div>
        <div>Ничего не найдено</div>
        <div style="font-size:12px;margin-top:8px;">Попробуйте изменить фильтры или поисковый запрос</div>
    </div>
</div>

<script>
const SKILLS = [
  {name:"Alchemist's Boon",weapon:"Any / no weapon req",support:false,id:"AlchemistsBoonPlayer",normalStat:"skill_alchemists_boon_generate_x_charges_for_any_flask_per_minute",normalVal:"100",gemStat:"alchemists_boon_attack_speed_granted_+%_during_life_flask",gemVal:"1000",hasGemling:true},
  {name:"Ancestral Cry",weapon:"One Hand Swords, Two Hand Swords, One Hand Axes, Two Hand Axes, One Hand Maces, Two Hand Maces, Quarterstaves, Claws, Daggers, Spears, Flails, Talismans",support:false,id:"AncestralCryPlayer",normalStat:"ancestral_cry_duration_+%_final_per_removable_endurance_charge",normalVal:"1000",gemStat:"gem_quality_ancestral_cry_global_fire_damage_granted_+%_final",gemVal:"500",hasGemling:true},

  {name:"Barkskin",weapon:"Any / no weapon req",support:false,id:"BarkskinPlayer",normalStat:"barkskin_armour_to_gain_as_%_of_energy_shield_lost_to_enemy_hits",normalVal:"250",gemStat:"active_skill_quality_duration_+%_final",gemVal:"1000",hasGemling:true},
  {name:"Barrage",weapon:"Spears, Bows",support:false,id:"BarragePlayer",normalStat:"empower_barrage_damage_-%_final_with_repeated_projectiles",normalVal:"-250",gemStat:"charge_skip_consume_chance_%",gemVal:"1000",hasGemling:true},

  {name:"Bind Spectre",weapon:"Any / no weapon req",support:false,id:"BindSpectrePlayer",normalStat:"active_skill_minion_damage_+%_final",normalVal:"1000",gemStat:"base_reservation_efficiency_+%",gemVal:"1000",hasGemling:true},
  {name:"Bitter Dead",weapon:"Any / no weapon req",support:false,id:"BitterDeadPlayer",normalStat:"volatile_dead_base_number_of_corpses_to_consume",normalVal:"50",gemStat:"base_chance_to_not_consume_corpse_%",gemVal:"500",hasGemling:true},
  {name:"Blink",weapon:"Any / no weapon req",support:false,id:"BlinkPlayer",normalStat:"base_cooldown_speed_+%",normalVal:"500",gemStat:"blink_travel_distance",gemVal:"1250",hasGemling:true},
  {name:"Blood Explosion",weapon:"Any / no weapon req",support:false,id:"BloodhoundsMarkExplosionPlayer",normalStat:"dummy_stat_display_nothing",normalVal:"1",gemStat:"active_skill_physical_damage_+%_final",gemVal:"1000",hasGemling:true},
  {name:"Blood Hunt",weapon:"Spears",support:false,id:"BloodHuntPlayer",normalStat:"active_skill_base_area_of_effect_radius",normalVal:"200",gemStat:"blood_hunt_explosion_%_blood_loss_to_deal_as_life_loss",gemVal:"200",hasGemling:true},
  {name:"Bone Cage",weapon:"Any / no weapon req",support:false,id:"BoneCagePlayer",normalStat:"active_skill_pins_as_though_dealt_damage_+%_final",normalVal:"2500",gemStat:"active_skill_bleeding_effect_+%_final",gemVal:"2000",hasGemling:true},
  {name:"Bone Offering",weapon:"Any / no weapon req",support:false,id:"BoneOfferingPlayer",normalStat:"bone_offering_damage_taken_+%_final_after_shield_loss",normalVal:"-1500",gemStat:"active_skill_quality_duration_+%_final",gemVal:"1500",hasGemling:true},
  {name:"Boneshatter",weapon:"One Hand Maces, Two Hand Maces",support:false,id:"BoneshatterPlayer",normalStat:"attack_speed_+%",normalVal:"1000",gemStat:"active_skill_base_area_of_effect_radius",gemVal:"1000",hasGemling:true},

let currentFilters = { gemling: 'all', support: 'all' };
let currentView = 'grid';
let searchQuery = '';
let sortCol = -1;
let sortDir = 1;

function init() {
    renderGrid();
    renderTable();
    applyFilters();
    document.getElementById('countTotal').textContent = SKILLS.length;

    document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value.toLowerCase().trim();
        document.getElementById('clearBtn').style.display = searchQuery ? 'block' : 'none';
        applyFilters();
    });
}

function clearSearch() {
    document.getElementById('searchInput').value = '';
    searchQuery = '';
    document.getElementById('clearBtn').style.display = 'none';
    applyFilters();
}

function setFilter(type, value, btn) {
    currentFilters[type] = value;
    const group = btn.parentElement;
    group.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
}

function setView(view, btn) {
    currentView = view;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('gridView').style.display = view === 'grid' ? 'block' : 'none';
    document.getElementById('tableView').style.display = view === 'table' ? 'block' : 'none';
}

function weaponMatch(weapon) {
    const wf = document.getElementById('weaponFilter').value;
    if (wf === 'all') return true;
    if (wf === 'any') return weapon.toLowerCase().includes('any');
    if (wf === 'Maces') return weapon.toLowerCase().includes('mace');
    if (wf === 'Swords') return weapon.toLowerCase().includes('sword');
    if (wf === 'Axes') return weapon.toLowerCase().includes('axe');
    return weapon.includes(wf);
}

function skillMatches(s) {
    if (currentFilters.gemling === 'yes' && !s.hasGemling) return false;
    if (currentFilters.gemling === 'no' && s.hasGemling) return false;
    if (currentFilters.support === 'skill' && s.support) return false;
    if (currentFilters.support === 'support' && !s.support) return false;
    if (!weaponMatch(s.weapon)) return false;
    if (searchQuery) {
        const hay = (s.name + ' ' + s.weapon + ' ' + s.id + ' ' + s.normalStat + ' ' + s.gemStat).toLowerCase();
        return hay.includes(searchQuery);
    }
    return true;
}

function highlight(text, query) {
    if (!query) return escHtml(text);
    const escaped = escHtml(text);
    const escapedQ = escHtml(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(`(${escapedQ})`, 'gi'), '<span class="highlight">$1</span>');
}

function escHtml(t) {
    return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatVal(v) {
    const n = parseInt(v);
    if (isNaN(n)) return v;
    return (n > 0 ? '+' : '') + (n/10).toFixed(1) + '%';
}

function getWeaponTags(weapon) {
    if (weapon.toLowerCase().includes('any') || weapon === 'N/A (support)') {
        return `<span class="weapon-tag any">${escHtml(weapon)}</span>`;
    }
    return weapon.split(',').map(w => `<span class="weapon-tag">${escHtml(w.trim())}</span>`).join('');
}

function renderGrid() {
    const grid = document.getElementById('skillsGrid');
    grid.innerHTML = SKILLS.map((s, i) => `
        <div class="skill-card ${s.hasGemling ? '' : 'no-gemling'}" data-index="${i}">
            <div class="card-header">
                <div class="skill-name">${escHtml(s.name)}</div>
                <span class="gemling-badge ${s.hasGemling ? 'yes' : 'no'}">${s.hasGemling ? '✓ Gemling' : '✗ No Gemling'}</span>
            </div>
            <div class="weapon-tags">${getWeaponTags(s.weapon)}</div>
            <div class="quality-block normal">
                <div class="quality-label normal">◆ Normal Quality</div>
                <div class="quality-stat ns-stat">${escHtml(s.normalStat)}</div>
                <div class="quality-value normal nv-val">${s.normalVal}</div>
            </div>
            ${s.hasGemling ? `
            <div class="quality-block gemling">
                <div class="quality-label gemling">◈ Gemling Quality</div>
                <div class="quality-stat gs-stat">${escHtml(s.gemStat)}</div>
                <div class="quality-value gemling gv-val">${s.gemVal}</div>
            </div>` : ''}
            <div class="internal-id">ID: ${escHtml(s.id)}</div>
        </div>
    `).join('');
}

function renderTable() {
    const tbody = document.getElementById('skillsTableBody');
    tbody.innerHTML = SKILLS.map((s, i) => `
        <tr data-index="${i}">
            <td class="td-name">${escHtml(s.name)}</td>
            <td class="td-weapon">${escHtml(s.weapon)}</td>
            <td class="td-stat ns-stat">${escHtml(s.normalStat)}</td>
            <td class="td-value-normal nv-val">${s.normalVal}</td>
            <td class="td-stat gs-stat">${s.hasGemling ? escHtml(s.gemStat) : '—'}</td>
            <td class="td-value-gemling gv-val">${s.hasGemling ? s.gemVal : '—'}</td>
            <td class="td-badge"><span class="gemling-badge ${s.hasGemling ? 'yes' : 'no'}">${s.hasGemling ? '✓' : '✗'}</span></td>
        </tr>
    `).join('');
}

function applyFilters() {
    let shown = 0;
    // Grid
    document.querySelectorAll('#skillsGrid .skill-card').forEach(card => {
        const i = parseInt(card.dataset.index);
        const s = SKILLS[i];
        const match = skillMatches(s);
        card.style.display = match ? '' : 'none';
        if (match) {
            shown++;
            // Highlight
            if (searchQuery) {
                card.querySelector('.skill-name').innerHTML = highlight(s.name, searchQuery);
                card.querySelector('.ns-stat').innerHTML = highlight(s.normalStat, searchQuery);
                card.querySelector('.nv-val').innerHTML = highlight(s.normalVal, searchQuery);
                if (s.hasGemling) {
                    card.querySelector('.gs-stat').innerHTML = highlight(s.gemStat, searchQuery);
                    card.querySelector('.gv-val').innerHTML = highlight(s.gemVal, searchQuery);
                }
            } else {
                card.querySelector('.skill-name').textContent = s.name;
                card.querySelector('.ns-stat').textContent = s.normalStat;
                card.querySelector('.nv-val').textContent = s.normalVal;
                if (s.hasGemling) {
                    card.querySelector('.gs-stat').textContent = s.gemStat;
                    card.querySelector('.gv-val').textContent = s.gemVal;
                }
            }
        }
    });
    // Table
    document.querySelectorAll('#skillsTableBody tr').forEach(row => {
        const i = parseInt(row.dataset.index);
        const s = SKILLS[i];
        const match = skillMatches(s);
        row.style.display = match ? '' : 'none';
        if (match && searchQuery) {
            row.cells[0].innerHTML = highlight(s.name, searchQuery);
            row.cells[2].innerHTML = highlight(s.normalStat, searchQuery);
            row.cells[4].innerHTML = s.hasGemling ? highlight(s.gemStat, searchQuery) : '—';
        } else if (match) {
            row.cells[0].textContent = s.name;
            row.cells[2].textContent = s.normalStat;
            row.cells[4].textContent = s.hasGemling ? s.gemStat : '—';
        }
    });
    document.getElementById('countShown').textContent = shown;
    document.getElementById('noResults').style.display = shown === 0 ? 'block' : 'none';
}

function sortTable(col) {
    const headers = document.querySelectorAll('.skills-table th');
    if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
    headers.forEach((h, i) => {
        h.classList.toggle('sorted', i === col);
        const arr = h.querySelector('.sort-arrow');
        if (arr) arr.textContent = i === col ? (sortDir === 1 ? '↑' : '↓') : '↕';
    });
    const keys = ['name','weapon','normalStat','normalVal','gemStat','gemVal','hasGemling'];
    const key = keys[col];
    const tbody = document.getElementById('skillsTableBody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    rows.sort((a, b) => {
        const ia = parseInt(a.dataset.index), ib = parseInt(b.dataset.index);
        const va = String(SKILLS[ia][key]), vb = String(SKILLS[ib][key]);
        return va.localeCompare(vb, undefined, {numeric: true}) * sortDir;
    });
    rows.forEach(r => tbody.appendChild(r));
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
